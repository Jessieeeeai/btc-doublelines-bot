<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智能工资助手</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  body{background:#f4f6fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .card{background:#fff;border:1px solid #eceef3;border-radius:14px}
  .btn{border-radius:10px;font-weight:600;transition:.15s}
  input,select,textarea{outline:none}
  ::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#d4d9e3;border-radius:8px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef } = React;
const TKEY = 'salary_token';
const C_PRIMARY = '#2f3a66';

// ---------- api ----------
async function api(action, params) {
  const token = localStorage.getItem(TKEY) || '';
  const r = await fetch('/api/rpc', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ action, params: params || {} })
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '请求失败');
  return j;
}
const fmt = (n, cur) => (cur || '¥') + (Math.round(Number(n) || 0)).toLocaleString();
const curMonth = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
function monthOptions() {
  const out = []; const d = new Date();
  for (let i = 0; i < 12; i++) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0')); }
  return out;
}

// ---------- small ui ----------
function Btn({ children, onClick, kind, className, type }) {
  const styles = {
    primary: 'text-white', ghost: 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-50',
    danger: 'bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100',
    soft: 'bg-slate-100 text-slate-600 hover:bg-slate-200'
  };
  const k = kind || 'primary';
  return <button type={type || 'button'} onClick={onClick}
    style={k === 'primary' ? { background: C_PRIMARY } : {}}
    className={`btn px-3.5 py-2 text-sm ${styles[k]} ${className || ''}`}>{children}</button>;
}
function Field({ label, children }) {
  return <label className="block"><div className="text-xs text-slate-500 mb-1">{label}</div>{children}</label>;
}
const inputCls = 'w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:border-indigo-400 bg-white';
function Modal({ title, onClose, children, wide }) {
  return <div className="fixed inset-0 bg-black/30 flex items-center justify-center z-50 p-4" onClick={onClose}>
    <div className={`card p-5 w-full ${wide ? 'max-w-3xl' : 'max-w-lg'} max-h-[88vh] overflow-auto`} onClick={e => e.stopPropagation()}>
      <div className="flex items-center justify-between mb-4">
        <div className="text-lg font-bold text-slate-800">{title}</div>
        <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
      </div>
      {children}
    </div>
  </div>;
}
function Badge({ children, color }) {
  const c = color || 'slate';
  const m = { slate: 'bg-slate-100 text-slate-600', green: 'bg-emerald-100 text-emerald-700', amber: 'bg-amber-100 text-amber-700', blue: 'bg-indigo-100 text-indigo-700' };
  return <span className={`px-2 py-0.5 rounded-md text-xs font-medium ${m[c]}`}>{children}</span>;
}
function Stat({ label, value, sub }) {
  return <div className="card p-4">
    <div className="text-xs text-slate-500">{label}</div>
    <div className="text-2xl font-bold text-slate-800 mt-1">{value}</div>
    {sub && <div className="text-xs text-slate-400 mt-1">{sub}</div>}
  </div>;
}

// =================== LOGIN ===================
function Login({ onLogin }) {
  const [mode, setMode] = useState('admin');
  const [pw, setPw] = useState(''); const [code, setCode] = useState('');
  const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  async function go() {
    setErr(''); setBusy(true);
    try {
      const r = await api('login', mode === 'admin' ? { password: pw } : { code });
      localStorage.setItem(TKEY, r.token);
      onLogin(r);
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  }
  return <div className="min-h-screen flex items-center justify-center p-4">
    <div className="card p-8 w-full max-w-md">
      <div className="text-2xl font-bold text-center" style={{ color: C_PRIMARY }}>智能工资助手</div>
      <div className="text-center text-slate-400 text-sm mt-1 mb-6">任务派发 · 绩效考核 · 自动算薪</div>
      <div className="flex bg-slate-100 rounded-lg p-1 mb-5">
        {[['admin', '管理员'], ['employee', '员工']].map(([m, l]) =>
          <button key={m} onClick={() => { setMode(m); setErr(''); }}
            className={`flex-1 py-2 rounded-md text-sm font-semibold ${mode === m ? 'bg-white shadow text-slate-800' : 'text-slate-500'}`}>{l}</button>)}
      </div>
      {mode === 'admin'
        ? <Field label="管理员密码"><input className={inputCls} type="password" value={pw}
            onChange={e => setPw(e.target.value)} onKeyDown={e => e.key === 'Enter' && go()} placeholder="默认 admin888" /></Field>
        : <Field label="员工登录码"><input className={inputCls} value={code}
            onChange={e => setCode(e.target.value)} onKeyDown={e => e.key === 'Enter' && go()} placeholder="向管理员索取" /></Field>}
      {err && <div className="text-rose-500 text-sm mt-3">{err}</div>}
      <div className="mt-5"><Btn onClick={go} className="w-full py-2.5">{busy ? '登录中…' : '登录'}</Btn></div>
    </div>
  </div>;
}

// =================== ADMIN ===================
function Admin({ session, onLogout }) {
  const [view, setView] = useState('mywork');
  const [month, setMonth] = useState(curMonth());
  const [state, setState] = useState(null);
  const [loading, setLoading] = useState(true);
  async function load() { setLoading(true); try { const r = await api('getState', { month }); setState(r); } catch (e) { alert(e.message); } setLoading(false); }
  useEffect(() => { load(); }, [month]);

  const nav = [['mywork', '我的工作台', '🏠'], ['dash', '仪表盘', '📊'], ['payroll', '工资核算', '💰'], ['tasks', '任务表', '📋'], ['kaohe', '月度考核表', '📝'], ['okr', 'OKR目标', '🚩'],
    ['expenses', '报销审批', '💳'], ['leave', '请假审批', '🏖'], ['announce', '公告通知', '📣'], ['chat', '聊天', '💬'],
    ['emps', '员工', '👥'], ['roles', '岗位与考核', '🎯'], ['settings', '设置', '⚙️']];

  return <div className="min-h-screen flex">
    <aside className="w-52 bg-white border-r border-slate-100 flex flex-col p-3 shrink-0">
      <div className="px-2 py-3 font-bold text-slate-800">{state?.settings?.companyName || '工资助手'}</div>
      <nav className="flex-1 space-y-1 mt-2">
        {nav.map(([k, l, ic]) => <button key={k} onClick={() => setView(k)}
          className={`w-full text-left px-3 py-2.5 rounded-lg text-sm flex items-center gap-2 ${view === k ? 'text-white' : 'text-slate-600 hover:bg-slate-50'}`}
          style={view === k ? { background: C_PRIMARY } : {}}><span>{ic}</span>{l}</button>)}
      </nav>
      <button onClick={onLogout} className="text-xs text-slate-400 hover:text-slate-600 px-3 py-2 text-left">退出登录</button>
    </aside>
    <main className="flex-1 p-6 overflow-auto h-screen">
      {view !== 'mywork' && <div className="flex items-center justify-between mb-5">
        <div className="text-xl font-bold text-slate-800">{nav.find(n => n[0] === view)[1]}</div>
        <div className="flex items-center gap-2">
          <span className="text-sm text-slate-500">月份</span>
          <select className="border border-slate-200 rounded-lg px-3 py-1.5 text-sm bg-white" value={month} onChange={e => setMonth(e.target.value)}>
            {monthOptions().map(m => <option key={m} value={m}>{m}</option>)}
          </select>
        </div>
      </div>}
      {view === 'mywork' && <MyWork session={session} embedded />}
      {view !== 'mywork' && (loading || !state ? <div className="text-slate-400">加载中…</div> : <>
        {view === 'dash' && <Dashboard state={state} month={month} />}
        {view === 'payroll' && <Payroll state={state} reload={load} />}
        {view === 'tasks' && <SheetView sheetId="tasks" session={session} />}
        {view === 'kaohe' && <SheetView sheetId="kaohe" session={session} />}
        {view === 'okr' && <AdminOkr state={state} />}
        {view === 'expenses' && <Expenses state={state} reload={load} />}
        {view === 'leave' && <AdminLeave />}
        {view === 'announce' && <Announce state={state} reload={load} />}
        {view === 'chat' && <Chat session={session} />}
        {view === 'emps' && <Employees state={state} reload={load} />}
        {view === 'roles' && <Roles state={state} reload={load} />}
        {view === 'settings' && <Settings state={state} reload={load} />}
      </>)}
    </main>
  </div>;
}

function Dashboard({ state, month }) {
  const cur = state.settings.currency;
  const pr = state.payroll;
  const [digest, setDigest] = useState(null); const [dBusy, setDBusy] = useState(false);
  useEffect(() => { api('getDigest', { month }).then(r => setDigest(r.digest)).catch(() => {}); }, [month]);
  async function genDigest() { setDBusy(true); try { const r = await api('weeklyDigest', {}); setDigest({ summary: r.summary, month }); } catch (e) { alert(e.message); } setDBusy(false); }
  const total = pr.reduce((a, p) => a + p.salary.total, 0);
  const avgPerf = pr.length ? Math.round(pr.reduce((a, p) => a + p.perf.perfScore, 0) / pr.length * 10) / 10 : 0;
  const finalized = pr.filter(p => p.finalized).length;
  const reimburse = pr.reduce((a, p) => a + (p.reimburse || 0), 0);
  const chartRef = useRef(null); const chartObj = useRef(null);
  useEffect(() => {
    let alive = true;
    api('trend', {}).then(r => {
      if (!alive || !chartRef.current) return;
      if (chartObj.current) chartObj.current.destroy();
      chartObj.current = new Chart(chartRef.current, {
        data: { labels: r.series.map(s => s.month), datasets: [
          { type: 'bar', label: '应发总额', data: r.series.map(s => s.total), backgroundColor: '#9aa7d8', yAxisID: 'y' },
          { type: 'line', label: '平均绩效', data: r.series.map(s => s.avgPerf), borderColor: '#2f3a66', backgroundColor: '#2f3a66', yAxisID: 'y1', tension: .3 }
        ] },
        options: { responsive: true, maintainAspectRatio: false,
          scales: { y: { position: 'left', title: { display: true, text: '工资' } }, y1: { position: 'right', max: 100, grid: { drawOnChartArea: false }, title: { display: true, text: '绩效' } } } }
      });
    }).catch(() => {});
    return () => { alive = false; };
  }, []);
  const byRole = {};
  pr.forEach(p => { const r = p.employee.role; (byRole[r] = byRole[r] || { n: 0, total: 0, perf: 0 }); byRole[r].n++; byRole[r].total += p.salary.total; byRole[r].perf += p.perf.perfScore; });

  return <div className="space-y-5">
    <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
      <Stat label={`本月应发总额 (${month})`} value={fmt(total, cur)} />
      <Stat label="平均绩效分" value={avgPerf} sub="满分 100" />
      <Stat label="在职人数" value={pr.length} />
      <Stat label="已定薪" value={`${finalized}/${pr.length}`} sub="已确认的人数" />
      <Stat label="本月报销(已通过)" value={fmt(reimburse, cur)} />
    </div>
    <div className="card p-4"><div className="font-semibold text-slate-700 mb-2">近 6 个月趋势</div>
      <div style={{ height: 260 }}><canvas ref={chartRef}></canvas></div></div>
    <div className="card p-4">
      <div className="flex items-center justify-between mb-2">
        <div className="font-semibold text-slate-700">📰 本周团队周报（AI）</div>
        <Btn kind="ghost" onClick={genDigest}>{dBusy ? '生成中…' : '生成/刷新周报'}</Btn>
      </div>
      <div className="text-sm text-slate-600 whitespace-pre-wrap">{digest ? digest.summary : '点右上角生成本月周报（已设每周一自动生成）'}</div>
    </div>
    <div className="card p-4"><div className="font-semibold text-slate-700 mb-3">按岗位汇总</div>
      <table className="w-full text-sm">
        <thead><tr className="text-slate-400 text-left border-b border-slate-100"><th className="py-2">岗位</th><th>人数</th><th>平均绩效</th><th>应发合计</th></tr></thead>
        <tbody>{Object.entries(byRole).map(([r, v]) => <tr key={r} className="border-b border-slate-50">
          <td className="py-2 font-medium text-slate-700">{r}</td><td>{v.n}</td><td>{Math.round(v.perf / v.n * 10) / 10}</td><td>{fmt(v.total, cur)}</td></tr>)}</tbody>
      </table></div>
  </div>;
}

function Payroll({ state, reload }) {
  const cur = state.settings.currency;
  const [edit, setEdit] = useState(null);
  function exportCsv() {
    const rows = [['姓名', '岗位', '完成分(参考)', '底薪', '绩效', '分成', '激励', '应发合计', '状态']];
    state.payroll.forEach(p => rows.push([p.employee.name, p.employee.role, p.perf.perfScore, p.salary.base, p.salary.perfAmount, p.salary.commission, p.salary.incentive, p.salary.total, p.finalized ? '已定薪' : '草稿']));
    const csv = '﻿' + rows.map(r => r.join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = `工资表_${state.month}.csv`; a.click();
  }
  return <div>
    <div className="flex justify-end mb-3"><Btn kind="ghost" onClick={exportCsv}>导出 CSV</Btn></div>
    <div className="card overflow-hidden">
      <table className="w-full text-sm">
        <thead><tr className="text-slate-400 text-left bg-slate-50">
          <th className="py-2.5 px-3">姓名</th><th>岗位</th><th>完成分<span className="font-normal text-slate-300">(参考)</span></th><th>底薪</th><th>绩效</th><th>分成</th><th>激励</th><th>应发合计</th><th>状态</th><th></th></tr></thead>
        <tbody>{state.payroll.map(p => <tr key={p.employee.id} className="border-t border-slate-50 hover:bg-slate-50/60">
          <td className="py-2.5 px-3 font-medium text-slate-800">{p.employee.name}</td>
          <td>{p.employee.role}</td>
          <td><span className="text-slate-400">{p.perf.perfScore}</span></td>
          <td>{fmt(p.salary.base, cur)}</td><td><span style={{ color: C_PRIMARY }} className="font-semibold">{fmt(p.salary.perfAmount, cur)}</span></td>
          <td>{fmt(p.salary.commission, cur)}</td><td>{fmt(p.salary.incentive, cur)}</td>
          <td className="font-bold text-slate-800">{fmt(p.salary.total, cur)}</td>
          <td>{p.finalized ? <Badge color="green">已定薪</Badge> : <Badge color="amber">草稿</Badge>}</td>
          <td className="pr-3"><Btn kind="soft" onClick={() => setEdit(p)}>核算</Btn></td>
        </tr>)}</tbody>
      </table>
    </div>
    {edit && <AssessModal p={edit} state={state} onClose={() => setEdit(null)} reload={reload} />}
  </div>;
}

function AssessModal({ p, state, onClose, reload }) {
  const role = state.roles.find(r => r.name === p.employee.role);
  const a0 = p.assessment || {};
  const [kpi, setKpi] = useState(a0.kpiScores || {});
  const [perfAmount, setPerfAmount] = useState(a0.perfAmount ?? '');
  const [biz, setBiz] = useState(a0.businessBase ?? '');
  const [inc, setInc] = useState(a0.incentive ?? '');
  const [commission, setCommission] = useState(a0.commissionRate ?? '');
  const [notes, setNotes] = useState(a0.notes || '');
  const [busy, setBusy] = useState(false);
  const [aiReviewTxt, setAiReviewTxt] = useState(''); const [aiBusy, setAiBusy] = useState('');
  const prevMonth = (() => { const [y, mo] = state.month.split('-').map(Number); const d = new Date(y, mo - 2, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); })();
  const [ctx, setCtx] = useState(null);
  const [reviews, setReviews] = useState(null);
  useEffect(() => {
    api('empTasks', { employeeId: p.employee.id, months: [state.month, prevMonth] }).then(r => setCtx(r.tasks || {})).catch(() => {});
    api('reviewsFor', { employeeId: p.employee.id, month: state.month }).then(r => setReviews(r.reviews || [])).catch(() => {});
  }, []);
  async function genReview() { setAiBusy('review'); try { const r = await api('aiReview', { employeeId: p.employee.id, month: state.month }); setAiReviewTxt(r.result); } catch (e) { alert(e.message); } setAiBusy(''); }
  async function genComment() { setAiBusy('comment'); try { const r = await api('aiComment', { employeeId: p.employee.id, month: state.month }); setNotes(r.result); } catch (e) { alert(e.message); } setAiBusy(''); }
  async function save(finalize) {
    setBusy(true);
    try {
      await api('saveAssessment', { assessment: {
        employeeId: p.employee.id, month: state.month, kpiScores: kpi,
        perfAmount: perfAmount === '' ? 0 : Number(perfAmount),
        businessBase: biz === '' ? 0 : Number(biz), incentive: inc === '' ? 0 : Number(inc),
        commissionRate: commission === '' ? undefined : Number(commission), notes
      } });
      if (finalize !== undefined) await api('finalizeAssessment', { employeeId: p.employee.id, month: state.month, unfinalize: !finalize });
      await reload(); onClose();
    } catch (e) { alert(e.message); } setBusy(false);
  }
  return <Modal title={`核算 · ${p.employee.name}（${p.employee.role}）`} onClose={onClose} wide>
    <div className="border border-slate-200 rounded-lg p-3 mb-4">
      <div className="text-xs text-slate-400 mb-2">📋 工作与完成情况（判断绩效时参考）</div>
      {[[state.month, '本月'], [prevMonth, '上月']].map(([m, label]) => <div key={m} className="mb-2 last:mb-0">
        <div className="text-xs font-semibold text-slate-600 mb-1">{label}（{m}）</div>
        {!ctx ? <div className="text-slate-300 text-xs">加载中…</div> :
          (ctx[m] || []).length === 0 ? <div className="text-slate-300 text-xs">无任务记录</div> :
            <div className="space-y-1">{(ctx[m] || []).map(t => <div key={t.id} className="text-sm flex items-start gap-2">
              <Badge color={TASK_STATUS[t.status] || 'slate'}>{t.status || '进行中'}</Badge>
              <span className="font-medium text-slate-700">{t.title}</span>
              {t.note && <span className="text-slate-400">— {t.note}</span>}</div>)}</div>}
      </div>)}
      {reviews && reviews.length > 0 && <div className="mt-2 pt-2 border-t border-slate-100">
        <div className="text-xs font-semibold text-slate-600 mb-1">🤝 同事互评（{reviews.length}人 · 均分 {(reviews.reduce((a, r) => a + (Number(r.score) || 0), 0) / reviews.length).toFixed(1)}）</div>
        {reviews.map(r => <div key={r.id} className="text-sm text-slate-600">· {r.score}分{r.comment ? ' — ' + r.comment : ''}</div>)}
      </div>}
    </div>
    <div className="bg-indigo-50 rounded-lg p-3 mb-4">
      <div className="text-xs text-slate-500 mb-1">底薪（固定）：<b className="text-slate-700">{fmt(p.salary.base, state.settings.currency)}</b>
        　完成情况参考分（自动，仅辅助判断）：<b>{p.perf.perfScore}</b></div>
      <Field label="★ 绩效金额（你看完成情况后判断，本月发多少绩效）">
        <input className={inputCls} type="number" value={perfAmount} onChange={e => setPerfAmount(e.target.value)} placeholder="例如 2000；留空=0" /></Field>
    </div>
    <div className="grid grid-cols-3 gap-3 mb-4">
      <Field label="激励 / 额外"><input className={inputCls} type="number" value={inc} onChange={e => setInc(e.target.value)} placeholder="0" /></Field>
      <Field label="业绩基数（商务/交易分成用，可空）"><input className={inputCls} type="number" value={biz} onChange={e => setBiz(e.target.value)} placeholder="0" /></Field>
      <Field label={`分成比例（默认 ${p.employee.commissionRate}）`}><input className={inputCls} type="number" step="0.01" value={commission} onChange={e => setCommission(e.target.value)} placeholder={String(p.employee.commissionRate)} /></Field>
    </div>
    <div className="text-xs text-slate-400 mb-1">完成情况打分（参考，辅助你和 AI 判断，不直接进工资）</div>
    {role && role.kpis.length ? <div className="grid grid-cols-3 gap-2 mb-3">
      {role.kpis.map(k => <Field key={k.name} label={`${k.name}（满分${k.max}）`}>
        <input className={inputCls} type="number" value={kpi[k.name] ?? ''}
          onChange={e => setKpi({ ...kpi, [k.name]: e.target.value })} placeholder={`0~${k.max}`} /></Field>)}
    </div> : <div className="text-slate-300 text-sm mb-3">该岗位未设参考指标，可在「岗位与考核」添加。</div>}
    <div className="flex gap-2 my-3">
      <Btn kind="ghost" onClick={genReview}>{aiBusy === 'review' ? 'AI 分析中…' : '🤖 AI 考核建议'}</Btn>

// =================== 自定义内联表格（像飞书多维表格：点格子直接填、列可改）===================
function Cell({ col, value, employees, onSave }) {
  const [v, setV] = useState(value == null ? '' : value);
  useEffect(() => { setV(value == null ? '' : value); }, [value]);
  if (col.type === 'select' || col.type === 'person') {
    const opts = col.type === 'person' ? (employees || []).map(e => e.name) : (col.options || []);
    return <select className="w-full border-0 bg-transparent text-sm py-1 focus:bg-indigo-50 rounded" value={v} onChange={e => { setV(e.target.value); onSave(e.target.value); }}><option value=""></option>{opts.map(o => <option key={o}>{o}</option>)}</select>;
  }
  if (col.type === 'checkbox') return <div className="py-1"><input type="checkbox" checked={!!v} onChange={e => { setV(e.target.checked); onSave(e.target.checked); }} /></div>;
  if (col.type === 'number') return <input type="number" className="w-full border-0 bg-transparent text-sm py-1 focus:bg-indigo-50 rounded" value={v} onChange={e => setV(e.target.value)} onBlur={() => v !== (value == null ? '' : value) && onSave(v)} />;
  if (col.type === 'date') return <input type="date" className="w-full border-0 bg-transparent text-sm py-1 focus:bg-indigo-50 rounded" value={v} onChange={e => setV(e.target.value)} onBlur={() => v !== (value || '') && onSave(v)} />;
  return <textarea rows="1" className="w-full border-0 bg-transparent text-sm py-1 resize-none focus:bg-indigo-50 rounded leading-snug" value={v} onChange={e => setV(e.target.value)} onBlur={() => v !== (value || '') && onSave(v)} />;
}
function SheetView({ sheetId, session, embedded }) {

  function startResize(e, col) {
    e.preventDefault(); const startX = e.clientX; const startW = col.width || 150;

function FieldConfigModal({ sheet, onClose, reload }) {
  const [cols, setCols] = useState(JSON.parse(JSON.stringify(sheet.columns || [])));

  function move(i, dir) { const j = i + dir; if (j < 0 || j >= cols.length) return; const x = [...cols];[x[i], x[j]] = [x[j], x[i]]; setCols(x); }

const TASK_STATUS = { '进行中': 'amber', '已完成': 'green', '已归档': 'slate' };
// 排序：未归档在前、已归档在后；同组按截止日期升序（无日期排最后），再按创建时间
function byDue(a, b) {
  const arch = s => (s === '已归档' ? 1 : 0);
  if (arch(a.status) !== arch(b.status)) return arch(a.status) - arch(b.status);
  const da = a.dueDate || '9999-99-99', db = b.dueDate || '9999-99-99';
  if (da !== db) return da < db ? -1 : 1;
  return (a.createdAt || 0) - (b.createdAt || 0);
}

}
function MyTaskModal({ t, month, onClose, reload }) {
  const [f, setF] = useState({ title: t.title || '', department: t.department || '', collaborators: t.collaborators || '', dueDate: t.dueDate || '', status: t.status || '进行中', note: t.note || '' });
  const up = (k, v) => setF({ ...f, [k]: v });
  async function save() {
    if (!f.title) return alert('请填任务标题');
    await api('myTaskSave', { task: { id: t.id, month, ...f } }); reload(); onClose();
  }
  return <Modal title={t.id ? '编辑任务' : '添加任务'} onClose={onClose}>
    <Field label="任务"><input className={inputCls} value={f.title} onChange={e => up('title', e.target.value)} /></Field>
    <div className="grid grid-cols-2 gap-3 mt-3">
      <Field label="部门"><input className={inputCls} value={f.department} onChange={e => up('department', e.target.value)} placeholder="运营/社群…" /></Field>
      <Field label="配合人员"><input className={inputCls} value={f.collaborators} onChange={e => up('collaborators', e.target.value)} /></Field>
      <Field label="预计完成日期"><input className={inputCls} type="date" value={f.dueDate} onChange={e => up('dueDate', e.target.value)} /></Field>
      <Field label="进度"><select className={inputCls} value={f.status} onChange={e => up('status', e.target.value)}>{Object.keys(TASK_STATUS).map(s => <option key={s}>{s}</option>)}</select></Field>
    </div>
    <Field label="当前情况"><textarea className={inputCls + ' mt-3'} rows="2" value={f.note} onChange={e => up('note', e.target.value)} /></Field>
    <div className="flex justify-end gap-2 mt-4"><Btn kind="ghost" onClick={onClose}>取消</Btn><Btn onClick={save}>保存</Btn></div>
  </Modal>;
}
function EmpExpenses({ data, month, reload, cur }) {
  const [amount, setAmount] = useState(''); const [category, setCategory] = useState('交通'); const [note, setNote] = useState(''); const [photoUrl, setPhotoUrl] = useState('');
  const [busy, setBusy] = useState(false);
  const stMap = { pending: ['待审批', 'amber'], approved: ['已通过', 'green'], rejected: ['已驳回', 'slate'] };
  async function submit() {
    if (!amount) return alert('请填写金额');
    setBusy(true);
    try { await api('submitExpense', { expense: { month, amount: Number(amount), category, note, photoUrl } }); setAmount(''); setNote(''); setPhotoUrl(''); await reload(); }
    catch (e) { alert(e.message); } setBusy(false);
  }
  return <div className="card p-4 mt-5">
    <div className="font-semibold text-slate-700 mb-3">💳 报销</div>
    <div className="grid grid-cols-2 gap-2 mb-2">
      <Field label="金额"><input className={inputCls} type="number" value={amount} onChange={e => setAmount(e.target.value)} /></Field>
      <Field label="类别"><select className={inputCls} value={category} onChange={e => setCategory(e.target.value)}>{['交通', '餐饮', '设备', '办公', '差旅', '其他'].map(c => <option key={c}>{c}</option>)}</select></Field>
    </div>
    <Field label="说明"><input className={inputCls} value={note} onChange={e => setNote(e.target.value)} /></Field>
    <Field label="发票/凭证链接（可选）"><input className={inputCls + ' mt-2'} value={photoUrl} onChange={e => setPhotoUrl(e.target.value)} placeholder="图片或网盘链接" /></Field>
    <div className="mt-2 text-right"><Btn onClick={submit}>{busy ? '提交中…' : '提交报销'}</Btn></div>
    {(data.expenses || []).length > 0 && <div className="mt-3 space-y-2">
      {data.expenses.map(e => <div key={e.id} className="flex items-center justify-between text-sm border-t border-slate-50 pt-2">
        <span className="text-slate-600">{e.category} · {fmt(e.amount, cur)} <span className="text-slate-400">{e.note}</span></span>
        <Badge color={stMap[e.status][1]}>{stMap[e.status][0]}</Badge></div>)}
    </div>}
  </div>;
}
function TaskCard({ t, stMap, reload }) {
  const [note, setNote] = useState(t.note || '');
  const [busy, setBusy] = useState(false);
  async function submit() { setBusy(true); try { await api('submitTask', { taskId: t.id, note }); await reload(); } catch (e) { alert(e.message); } setBusy(false); }
  return <div className="border border-slate-100 rounded-xl p-3">
    <div className="flex items-center justify-between">
      <div className="font-medium text-slate-700">{t.title} <span className="text-slate-400 text-sm">· {t.points}分</span></div>
      <Badge color={stMap[t.status][1]}>{stMap[t.status][0]}</Badge>
    </div>
    {t.desc && <div className="text-sm text-slate-400 mt-1">{t.desc}</div>}
    {t.due && <div className="text-xs text-slate-400 mt-1">截止 {t.due}</div>}
    <textarea className={inputCls + ' mt-2'} rows="2" placeholder="填写完成情况…" value={note} onChange={e => setNote(e.target.value)} disabled={t.status === 'scored'} />
    {t.status === 'scored' && <div className="text-sm text-emerald-600 mt-1">已打分：{t.score} / {t.points}</div>}
    {t.status !== 'scored' && <div className="mt-2 text-right"><Btn onClick={submit}>{busy ? '…' : (t.status === 'submitted' ? '更新' : '提交')}</Btn></div>}
  </div>;
}

// =================== ROOT ===================
function App() {
  const [session, setSession] = useState(null);
  const [ready, setReady] = useState(false);
  useEffect(() => {
    if (localStorage.getItem(TKEY)) api('me').then(r => setSession(r)).catch(() => localStorage.removeItem(TKEY)).finally(() => setReady(true));
    else setReady(true);
  }, []);
  function logout() { localStorage.removeItem(TKEY); setSession(null); }
  if (!ready) return <div className="min-h-screen flex items-center justify-center text-slate-400">加载中…</div>;
  if (!session) return <Login onLogin={setSession} />;
  return session.role === 'admin' ? <Admin session={session} onLogout={logout} /> : <MyWork session={session} onLogout={logout} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
