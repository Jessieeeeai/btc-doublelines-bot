name: 重叠颈线赛马机器人 (纸面)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [check-signals]

jobs:
  run-neckline-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install matplotlib
        run: pip install --quiet matplotlib

      - name: Run neckline race bot (4 horses, paper)
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.NECKLINE_TG_BOT_TOKEN != '' && secrets.NECKLINE_TG_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.NECKLINE_TG_CHAT_ID != '' && secrets.NECKLINE_TG_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          # 同步播报到群 "cutie，双线反转助手以及大老虎"
          TELEGRAM_GROUP_CHAT_ID: "-5515956430"
        run: |
          python3 neckline_bot.py

      - name: Commit state files if changed
        run: |
          if [ -n "$(git status --porcelain state_N_*.json neckline_feed*.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state_N_*.json neckline_feed*.json 2>/dev/null || true
            git commit -m "update neckline race states $(date -u +'%Y-%m-%d %H:%M UTC')"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              git pull --rebase --autostash origin main || true
              sleep $((RANDOM % 5 + 2))
            done
            if [ "$pushed" != "1" ]; then
              echo "::warning::5 次重试后仍无法 push state"
            fi
          else
            echo "state files unchanged, no commit needed"
          fi
