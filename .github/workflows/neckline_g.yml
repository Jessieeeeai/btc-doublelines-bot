name: 颈线马G 实盘口径观察 (纸面)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: neckline-g
  cancel-in-progress: false

jobs:
  run-neckline-g:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run horse G (paper, live-accounting)
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.NECKLINE_TG_BOT_TOKEN != '' && secrets.NECKLINE_TG_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.NECKLINE_TG_CHAT_ID != '' && secrets.NECKLINE_TG_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: "-5515956430"
        run: |
          python3 neckline_g.py

      - name: Commit state_N_G.json if changed
        run: |
          if [ -n "$(git status --porcelain state_N_G.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state_N_G.json
            git commit -m "update horse G state $(date -u +'%Y-%m-%d %H:%M UTC')"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              git pull --rebase --autostash origin main || true
              sleep $((RANDOM % 5 + 2))
            done
            if [ "$pushed" != "1" ]; then
              echo "::warning::5 次重试后仍无法 push state_N_G.json"
            fi
          else
            echo "state unchanged"
          fi
