name: 两线反转 马G 第2版 (纸面)

on:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [check-signals]
  workflow_dispatch:

concurrency:
  group: neckline-g
  cancel-in-progress: false

jobs:
  run-neckline-g:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install chart lib
        run: pip install matplotlib

      - name: Run horse G v2 (paper, live-accounting)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.NECKLINE_TG_BOT_TOKEN != '' && secrets.NECKLINE_TG_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.NECKLINE_TG_CHAT_ID != '' && secrets.NECKLINE_TG_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: "-5515956430"
        run: |
          python3 neckline_g2.py

      - name: Commit state + TokenBeep feeds if changed
        run: |
          git add state_N_G_v2.json
          git add twoline_feed_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "update horse G v2 state $(date -u +'%Y-%m-%d %H:%M UTC')"
            pushed=0
            for attempt in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              git pull --rebase --autostash origin main || true
              sleep $((RANDOM % 5 + 2))
            done
            if [ "$pushed" != "1" ]; then
              echo "::warning::5 次重试后仍无法 push 马G v2 的 state / feed"
            fi
          fi
